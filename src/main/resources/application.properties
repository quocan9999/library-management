spring.application.name=library-management
server.port=${SERVER_PORT:8081}

# Load environment variables từ file .env ở root project
spring.config.import=optional:file:./.env[.properties]

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Hibernate không tự update schema
spring.jpa.hibernate.ddl-auto=none
# Tránh log email từ cảnh báo unique constraint; vẫn giữ chẩn đoán mức ERROR/FATAL.
logging.level.org.hibernate.orm.jdbc.error=ERROR

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=production

# JWT configuration
jwt.secret-base64=${JWT_SECRET_BASE64:}
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=7d

# Cấu hình Gmail SMTP; thông tin xác thực lưu trong .env cục bộ.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

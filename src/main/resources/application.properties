spring.application.name=library-management
server.port=${SERVER_PORT:8081}

# Load environment variables từ file .env ở root project
spring.config.import=optional:file:./.env[.properties]

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Hibernate không tự update schema
spring.jpa.hibernate.ddl-auto=none

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

            tableName: permissions
            where: >
              code IN (
                'book:read',
                'book:create',
                'book:update',
                'book:delete',
                'book:import',
                'member:read',
                'member:create',
                'member:update',
                'member:delete',
                'borrow:create',
                'borrow:return',
                'account:change-password',
                'account:change-email',
                'config:read',
                'config:update'

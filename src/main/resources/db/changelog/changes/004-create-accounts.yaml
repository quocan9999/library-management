databaseChangeLog:
  - changeSet:
      id: 004-create-accounts
      author: quocan9999
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: SMALLINT
                  constraints:
                    nullable: false
              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: accounts
            baseColumnNames: role_id
            constraintName: fk_accounts_role
            referencedTableName: roles
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            tableName: accounts
            indexName: idx_accounts_role_id
            columns:
              - column:
                  name: role_id
        - sql:
            dbms: mysql
            sql: ALTER TABLE accounts ADD CONSTRAINT chk_accounts_username_or_email CHECK (username IS NOT NULL OR email IS NOT NULL)
      rollback:
        - dropTable:
            tableName: accounts

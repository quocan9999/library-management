databaseChangeLog:
  - changeSet:
      id: 008-seed-admin-account
      author: quocan9999

      changes:
        - insert:
            tableName: accounts
            columns:
              - column:
                  name: username
                  value: admin

              - column:
                  name: password_hash
                  value: "$2a$12$gx6FBrWWAiAp1sQjGYdhyeTsJhknAqHDTBqSiIGzjQHDooC6gawhy"

              - column:
                  name: role_id
                  valueNumeric: 1

              - column:
                  name: email_verified
                  valueBoolean: true

              - column:
                  name: enabled
                  valueBoolean: true

      rollback:
        - delete:
            tableName: accounts
            where: username = 'admin'
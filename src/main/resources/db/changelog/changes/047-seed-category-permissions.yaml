databaseChangeLog:
  - changeSet:
      id: 047-seed-category-permissions
      author: quocan9999
      comment: "USER chỉ được đọc danh mục để lọc sách; quyền quản lý đưa vào catalog để ADMIN gán cho Role động, ROLE_ADMIN được cấp sẵn toàn bộ."

      changes:
        - sql:
            dbms: mysql
            sql: |
              INSERT INTO permissions (code, description) VALUES
                ('category:read', 'Xem danh mục sách'),
                ('category:create', 'Tạo danh mục sách'),
                ('category:update', 'Cập nhật danh mục sách'),
                ('category:delete', 'Xóa danh mục sách');
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r CROSS JOIN permissions p
              WHERE r.code = 'USER' AND p.code = 'category:read';
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r CROSS JOIN permissions p
              WHERE r.code = 'ADMIN'
                AND p.code IN ('category:read', 'category:create', 'category:update', 'category:delete');

      rollback:
        - sql:
            dbms: mysql
            sql: |
              DELETE rp FROM role_permissions rp
              JOIN permissions p ON p.id = rp.permission_id
              WHERE p.code IN ('category:read', 'category:create', 'category:update', 'category:delete');
              DELETE FROM permissions
              WHERE code IN ('category:read', 'category:create', 'category:update', 'category:delete');

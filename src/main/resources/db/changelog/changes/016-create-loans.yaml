databaseChangeLog:
  - changeSet:
      id: 016-create-loans
      author: quocan9999

      changes:
        - createTable:
            tableName: loans
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: loan_code
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: member_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: borrowed_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: loans
            indexName: idx_loans_member_status
            columns:
              - column:
                  name: member_id
              - column:
                  name: status

        - createIndex:
            tableName: loans
            indexName: idx_loans_due_date
            columns:
              - column:
                  name: due_date

        - addForeignKeyConstraint:
            baseTableName: loans
            baseColumnNames: member_id
            referencedTableName: members
            referencedColumnNames: id
            constraintName: fk_loans_member
            onDelete: RESTRICT

        - sql:
            sql: >
              ALTER TABLE loans
              ADD CONSTRAINT chk_loans_due_date
              CHECK (due_date > DATE(borrowed_at))

        - sql:
            sql: >
              ALTER TABLE loans
              ADD CONSTRAINT chk_loans_status
              CHECK (
                status IN (
                  'ACTIVE',
                  'PARTIALLY_RETURNED',
                  'RETURNED'
                )
              )

      rollback:
        - dropTable:
            tableName: loans
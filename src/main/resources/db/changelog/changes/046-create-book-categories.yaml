databaseChangeLog:
  - changeSet:
      id: 046-create-book-categories
      author: quocan9999
      comment: "Bảng nối nhiều-nhiều giữa books và categories; xóa category bị chặn khi còn sách tham chiếu (FK RESTRICT)."

      changes:
        - createTable:
            tableName: book_categories
            columns:
              - column:
                  name: book_id
                  type: INT
                  constraints:
                    nullable: false
                    primaryKey: true

              - column:
                  name: category_id
                  type: INT
                  constraints:
                    nullable: false
                    primaryKey: true

        - addForeignKeyConstraint:
            baseTableName: book_categories
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: fk_book_categories_book
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: book_categories
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_book_categories_category
            onDelete: RESTRICT

        - createIndex:
            tableName: book_categories
            indexName: idx_book_categories_category
            columns:
              - column:
                  name: category_id

      rollback:
        - dropTable:
            tableName: book_categories

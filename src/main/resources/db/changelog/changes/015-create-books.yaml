databaseChangeLog:
  - changeSet:
      id: 015-create-books
      author: quocan9999

      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: book_code
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: isbn
                  type: VARCHAR(20)
                  constraints:
                    unique: true

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: author
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: publisher
                  type: VARCHAR(150)

              - column:
                  name: published_date
                  type: DATE

              - column:
                  name: total_quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: available_quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: borrow_fee
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: late_fee_per_day
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: books
            indexName: idx_books_title
            columns:
              - column:
                  name: title

        - createIndex:
            tableName: books
            indexName: idx_books_author
            columns:
              - column:
                  name: author

        - createIndex:
            tableName: books
            indexName: idx_books_published_date
            columns:
              - column:
                  name: published_date

        - sql:
            sql: >
              ALTER TABLE books
              ADD CONSTRAINT chk_books_total_quantity
              CHECK (total_quantity >= 0)

        - sql:
            sql: >
              ALTER TABLE books
              ADD CONSTRAINT chk_books_available_quantity
              CHECK (
                available_quantity >= 0
                AND available_quantity <= total_quantity
              )

        - sql:
            sql: >
              ALTER TABLE books
              ADD CONSTRAINT chk_books_borrow_fee
              CHECK (borrow_fee >= 0)

        - sql:
            sql: >
              ALTER TABLE books
              ADD CONSTRAINT chk_books_late_fee_per_day
              CHECK (late_fee_per_day >= 0)

      rollback:
        - dropTable:
            tableName: books
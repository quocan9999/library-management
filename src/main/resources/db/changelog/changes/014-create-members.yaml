databaseChangeLog:
  - changeSet:
      id: 014-create-members
      author: quocan9999

      changes:
        - createTable:
            tableName: members
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_id
                  type: INT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: member_code
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: full_name
                  type: VARCHAR(150)

              - column:
                  name: date_of_birth
                  type: DATE

              - column:
                  name: phone
                  type: VARCHAR(20)

              - column:
                  name: address
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: members
            indexName: idx_members_date_of_birth
            columns:
              - column:
                  name: date_of_birth

        - addForeignKeyConstraint:
            baseTableName: members
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_members_account

      rollback:
        - dropTable:
            tableName: members
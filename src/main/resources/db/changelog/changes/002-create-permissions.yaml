databaseChangeLog:
  - changeSet:
      id: 002-create-permissions
      author: quocan9999
      changes:
        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: SMALLINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: permissions

databaseChangeLog:
  - changeSet:
      id: 043-create-staffs
      author: quocan9999
      changes:
        - createTable:
            tableName: staffs
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_id
                  type: INT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_staffs_account_id

              - column:
                  name: staff_code
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_staffs_staff_code

              - column:
                  name: full_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: date_of_birth
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_staffs_phone

              - column:
                  name: address
                  type: VARCHAR(255)

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: staffs
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_staffs_account
            onDelete: RESTRICT

        - createIndex:
            tableName: staffs
            indexName: idx_staffs_date_of_birth
            columns:
              - column:
                  name: date_of_birth

        - sql:
            dbms: mysql
            comment: "Dọn dẹp các bản ghi độc giả trong members đã gán nhầm cho tài khoản quản trị"
            sql: >
              DELETE m FROM members m
              JOIN accounts a ON a.id = m.account_id
              JOIN roles r ON r.id = a.role_id
              WHERE r.code <> 'USER' OR m.member_code LIKE 'A%';

        - sql:
            dbms: mysql
            comment: "Khởi tạo dữ liệu hồ sơ nhân sự staffs cho các tài khoản quản trị hiện hữu"
            sql: >
              INSERT INTO staffs (account_id, staff_code, full_name, date_of_birth, phone, address, version, created_at, updated_at)
              SELECT a.id,
                     CONCAT('NV', LPAD(a.id, 6, '0')),
                     'Quản trị viên Hệ thống',
                     '1990-01-01',
                     CASE WHEN a.id = 1 THEN '0901234567' ELSE CONCAT('0901', LPAD(a.id, 6, '0')) END,
                     NULL,
                     0,
                     NOW(),
                     NOW()
              FROM accounts a
              JOIN roles r ON r.id = a.role_id
              LEFT JOIN staffs s ON s.account_id = a.id
              WHERE r.code <> 'USER' AND s.id IS NULL;

      rollback:
        - dropTable:
            tableName: staffs

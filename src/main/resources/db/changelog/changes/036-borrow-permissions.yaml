databaseChangeLog:
  - changeSet:
      id: 036-borrow-permissions
      author: quocan9999
      comment: "USER có quyền tự phục vụ; quyền tại quầy chỉ đưa vào catalog để ADMIN gán cho Role động."
      changes:
        - sql:
            dbms: mysql
            sql: |
              INSERT INTO permissions (code, description) VALUES
                ('borrow:read-own', 'Xem yêu cầu mượn của chính mình'),
                ('borrow:cancel-own', 'Hủy sách chưa nhận của chính mình'),
                ('borrow:renew', 'Gia hạn sách của chính mình'),
                ('borrow:read', 'Tra cứu yêu cầu và nhận diện tại quầy'),
                ('borrow:prepare', 'Chuẩn bị sách và xác nhận sẵn sàng'),
                ('borrow:cancel', 'Hủy sách tại quầy trước thanh toán'),
                ('borrow:fee-confirm', 'Xác nhận phí mượn khi bàn giao'),
                ('borrow:handover', 'Bàn giao toàn bộ sách sẵn sàng của yêu cầu');
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r CROSS JOIN permissions p
              WHERE r.code = 'USER' AND p.code IN ('borrow:read-own', 'borrow:cancel-own', 'borrow:renew');

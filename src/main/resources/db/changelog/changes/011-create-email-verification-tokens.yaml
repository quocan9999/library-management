databaseChangeLog:
  - changeSet:
      id: 011-create-email-verification-tokens
      author: quocan9999

      changes:
        - createTable:
            tableName: email_verification_tokens
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: expires_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: used_at
                  type: DATETIME

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: email_verification_tokens
            indexName: idx_email_verification_tokens_account_id
            columns:
              - column:
                  name: account_id

        - addForeignKeyConstraint:
            baseTableName: email_verification_tokens
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_email_verification_tokens_account
            onDelete: CASCADE

      rollback:
        - dropTable:
            tableName: email_verification_tokens
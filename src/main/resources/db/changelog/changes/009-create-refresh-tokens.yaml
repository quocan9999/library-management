databaseChangeLog:
  - changeSet:
      id: 009-create-refresh-tokens
      author: quocan9999
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: jti
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: account_id
            constraintName: fk_refresh_tokens_account
            referencedTableName: accounts
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_account_id
            columns:
              - column:
                  name: account_id
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expires_at
            columns:
              - column:
                  name: expires_at
      rollback:
        - dropTable:
            tableName: refresh_tokens

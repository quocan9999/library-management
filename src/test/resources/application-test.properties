jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=7d
spring.liquibase.contexts=test

# Mọi Spring context từ test classpath dùng MySQL test cô lập.
spring.datasource.url=jdbc:mysql://${MYSQL_TEST_HOST:localhost}:${MYSQL_TEST_PORT:3308}/${MYSQL_TEST_DATABASE}
spring.datasource.username=${MYSQL_TEST_USER}
spring.datasource.password=${MYSQL_TEST_PASSWORD}

# Nhiều test context cùng được cache; mỗi pool vẫn đủ cho hai request race và transaction ngoài,
# nhưng không giữ mặc định10 kết nối/context làm cạn max_connections của MySQL test.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
